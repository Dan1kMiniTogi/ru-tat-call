[project]
name = "signaling-server"
version = "0.1.0"
description = "Signaling, auth and room management for ru-tat-call"
requires-python = ">=3.10"
dependencies = [
    "ru-tat-call-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=12",
]

[tool.uv.sources]
ru-tat-call-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
