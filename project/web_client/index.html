<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ru-tat-call</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="app">
      <section id="view-login" class="view" data-view="login">
        <header class="brand">
          <h1>ru-tat-call</h1>
          <p>Семейный звонок с живыми субтитрами</p>
        </header>
        <form id="login-form" class="card">
          <label>
            Кто вы
            <input id="login-id" name="identifier" autocomplete="username" required placeholder="you" />
          </label>
          <label>
            Пароль
            <input id="login-password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p class="chips-label">Быстрый вход</p>
          <div class="chips" id="login-chips"></div>
          <p id="login-error" class="error" hidden></p>
          <button type="submit" class="btn primary">Войти</button>
        </form>
      </section>

      <section id="view-home" class="view" data-view="home" hidden>
        <header class="topbar">
          <div>
            <p class="muted">Вы вошли как</p>
            <h1 id="home-name"></h1>
          </div>
          <button type="button" id="btn-logout" class="btn ghost">Выйти</button>
        </header>
        <h2 class="section-title">Контакты</h2>
        <ul id="contact-list" class="contact-list"></ul>
        <button type="button" id="btn-start-call" class="btn primary sticky-cta">Начать звонок</button>
      </section>

      <section id="view-room" class="view view-room" data-view="room" hidden>
        <div id="video-grid" class="video-grid" aria-label="Сетка видео"></div>
        <p id="media-hint" class="media-hint" hidden></p>
        <aside id="subtitle-panel" class="subtitle-panel" hidden>
          <div id="subtitle-list" class="subtitle-list" role="log" aria-live="polite" aria-label="Субтитры"></div>
        </aside>
        <nav class="call-bar" aria-label="Управление звонком">
          <button type="button" id="btn-mic" class="btn round" aria-pressed="true" aria-label="Микрофон">Мик</button>
          <button type="button" id="btn-cam" class="btn round" aria-pressed="true" aria-label="Камера">Кам</button>
          <button type="button" id="btn-hangup" class="btn round danger" aria-label="Завершить">Сброс</button>
        </nav>
      </section>
    </div>
    <div id="incoming-call" class="incoming" hidden>
      <p id="incoming-text">Входящий звонок</p>
      <div class="incoming-actions">
        <button type="button" id="btn-accept" class="btn primary">Принять</button>
        <button type="button" id="btn-reject" class="btn ghost">Отклонить</button>
      </div>
    </div>
    <script src="/js/pcm.js"></script>
    <script src="/js/subtitles.js"></script>
    <script src="/js/asr.js"></script>
    <script src="/js/pcm-capture.js"></script>
    <script src="/js/call.js"></script>
    <script src="/js/app.js" defer></script>
  </body>
</html>
